<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luna Go — Galería</title>
  <meta name="description" content="Obra de Luna Go por año y tipo." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="site-header"></div>

  <main class="viewer-page">
    <!-- encabezado: Categoría · Año -->
    <div class="gallery-head">
      <h1 id="gTitle">Galería</h1>
      <span class="counter" id="gCounter"></span>
    </div>

    <!-- visor de la obra (se ve entera, estilo James Jean) -->
    <div class="viewer" id="viewer">
      <button class="v-nav prev" id="vPrev" aria-label="Obra anterior">‹</button>
      <button class="v-nav next" id="vNext" aria-label="Obra siguiente">›</button>
    </div>

    <!-- ficha de la obra -->
    <div class="v-meta" id="vMeta"></div>

    <!-- descripción de la obra (solo en la galería) -->
    <p class="v-desc" id="vDesc"></p>

    <!-- tira de miniaturas -->
    <div class="filmstrip" id="film"></div>
  </main>

  <script src="data.js"></script>
  <script src="site.js" defer></script>
  <script src="galeria.js" defer></script>
  <script src="lightbox.js" defer></script>
</body>
</html>
